<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1 11 13" shape-rendering="crispEdges"><style>@keyframes up{0%,70%,100%{transform:translateY(0)}80%,90%{transform:translateY(-1px)}}.a{animation:up 1.2s steps(1) infinite}.b{animation:up 1.2s steps(1) .2s infinite}.c{animation:up 1.2s steps(1) .4s infinite}</style><rect class="a" x="0" y="4" width="3" height="2" fill="#0ECBFF"/><rect class="b" x="4" y="2" width="3" height="4" fill="#0ECBFF"/><rect class="b" x="4" y="6" width="3" height="6" fill="#1E66F5"/><rect class="c" x="8" y="0" width="3" height="6" fill="#FF5563"/></svg>